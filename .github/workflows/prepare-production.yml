name: REG.RU PHP deploy

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Exact candidate commit SHA to check
        type: string
        required: true
      publish:
        description: Publish the guarded read-only post-counter summary after tests
        type: boolean
        default: false
      publish_callback:
        description: Publish the guarded Callback API receiver to the webroot
        type: boolean
        default: false
      publish_callback_bridge:
        description: Provision private event directory and update MCP wrapper with callback
        type: boolean
        default: false
      enable_wall_reply_new:
        description: Enable only wall_reply_new on the confirmed VK callback server after deployment
        type: boolean
        default: false
      inspect_runtime:
        description: Report credential variable presence from private configuration
        type: boolean
        default: false
      read_probe:
        description: Invoke read-only MCP wall collector from server without disclosing credentials
        type: boolean
        default: false
      diagnose_callback:
        description: Read-only check of protected callback and MCP reader wiring
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vk-to-gpt-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_REVISION: ${{ inputs.expected_revision }}
    steps:
      - name: Check the approved revision
        run: test "$EXPECTED_REVISION" = "$GITHUB_SHA"
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          extensions: curl, fileinfo, json, openssl, mbstring, pdo_sqlite, sqlite3
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test candidate
        run: |
          set -eu
          composer validate --no-check-publish
          composer install --no-dev --no-interaction --prefer-dist --no-scripts
          composer check-platform-reqs --no-dev
          composer audit --locked --no-interaction
          composer test
          node test/php/contract.mjs
          node --test test/read-only.test.js
          python3 -B test/php/smoke_http.py
          bash test/php/update_read_diagnostics.sh
          php -l deploy/probe-wall.php
          php -l public/callback.php
          php -l deploy/mcp.php
          php -l deploy/callback-bridge.php
          php -l deploy/enable-wall-reply-callback.php
          python3 -B test/php/callback_confirmation.py
          bash -n deploy/update-webroot-file.sh
      - name: Package the bounded publish set
        run: |
          set -eu
          mkdir -p stage/php artifact
          cp php/WallCollector.php stage/php/
          cp deploy/update-read-diagnostics.sh stage/
          cp public/callback.php stage/
          cp deploy/mcp.php stage/mcp.php
          cp deploy/callback-bridge.php stage/
          cp deploy/update-webroot-file.sh stage/
          printf '%s\n' "$GITHUB_SHA" > stage/REVISION
          tar -C stage -czf artifact/diagnostics.tgz php/WallCollector.php REVISION update-read-diagnostics.sh callback.php mcp.php callback-bridge.php update-webroot-file.sh
          (cd artifact && sha256sum diagnostics.tgz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: vk-to-gpt-php-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 7

  deploy:
    # Analytics deploys stay on the MCP branch; callback deploys may run from either release branch.
    if: github.actor == 'alena-lenom' && ((github.ref == 'refs/heads/feat/php-mcp-http' && (inputs.publish || inputs.publish_callback)) || (github.ref == 'refs/heads/feat/callback-api-receiver' && inputs.publish_callback))
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      PROD_HOST: ${{ secrets.PROD_HOST }}
      PROD_USER: ${{ secrets.PROD_USER }}
      PROD_PATH: ${{ vars.PROD_PATH }}
      BASELINE: 66726f80564dafe24adab25dd01bd113477231b5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vk-to-gpt-php-${{ github.sha }}
          path: artifact
      - name: Configure trusted SSH
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          set -eu
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf '%s\n' 'Host *' '  BatchMode yes' '  IdentitiesOnly yes' '  StrictHostKeyChecking yes' '  ConnectTimeout 15' > "$HOME/.ssh/config"
          ssh-keygen -F "$PROD_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null
      - name: Update code and verify HTTPS and MCP
        if: inputs.publish && github.ref == 'refs/heads/feat/php-mcp-http'
        run: |
          set -euo pipefail
          target="$PROD_USER@$PROD_HOST"
          app=/var/www/u3641285/data/vk-to-gpt/app
          python3 -B deploy/verify.py --baseline "$RUNNER_TEMP/home.sha256"
          (cd artifact && sha256sum -c SHA256SUMS)
          stage=$(ssh "$target" 'umask 077; mktemp -d /tmp/vk-to-gpt-diagnostics.XXXXXXXX')
          [[ $stage =~ ^/tmp/vk-to-gpt-diagnostics\.[a-zA-Z0-9]{8}$ ]]
          applied=false
          applying=false
          cleanup() {
            status=$?
            if (( status )) && [[ $applied == true ]]; then
              if ! ssh "$target" bash "$stage/update-read-diagnostics.sh" rollback "$app" "$stage" "$BASELINE" "$GITHUB_SHA"; then
                echo "Rollback failed. Retained backup at $stage/backup" >&2
                return "$status"
              fi
            elif (( status )) && [[ $applying == true ]]; then
              echo "Update failed. Inspect any backup at $stage/backup" >&2
              return "$status"
            fi
            ssh "$target" rm -rf -- "$stage"
            return "$status"
          }
          trap cleanup EXIT
          scp -q artifact/diagnostics.tgz "$target:$stage/"
          ssh "$target" tar -xzf "$stage/diagnostics.tgz" -C "$stage"
          for file in WallCollector.php; do
            ssh "$target" /opt/php/8.4/bin/php -l "$stage/php/$file"
          done
          applying=true
          ssh "$target" bash "$stage/update-read-diagnostics.sh" apply "$app" "$stage" "$BASELINE" "$GITHUB_SHA"
          applied=true
          [[ $(ssh "$target" cat "$app/REVISION") == "$GITHUB_SHA" ]]
          ssh "$target" /opt/php/8.4/bin/php <<'PHP' | python3 -B deploy/verify.py "$RUNNER_TEMP/home.sha256"
          <?php
          $config = require '/var/www/u3641285/data/vk-to-gpt/shared/config.php';
          echo $config['MCP_BEARER_TOKEN'];
          PHP
          ssh "$target" VK_PROBE_METRICS=1 /opt/php/8.4/bin/php < deploy/probe-wall.php
          printf '%s\n' 'Guarded post metrics update published. Exact revision, HTTPS, MCP, OAuth and live post_metric_summary verified.' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish guarded callback endpoint
        if: inputs.publish_callback
        run: |
          set -euo pipefail
          target="$PROD_USER@$PROD_HOST"
          webroot=${PROD_PATH:?PROD_PATH variable is required}
          [[ $webroot =~ ^/var/www/u[0-9]+/data/www/vk[.]tattoomystery[.]ru$ ]]
          # Validate the existing private config before touching the public endpoint.
          ssh "$target" /opt/php/8.4/bin/php <<'PHP'
          <?php
          ini_set('display_errors', '0');
          try {
              $config = require '/var/www/u3641285/data/vk-to-gpt/shared/config.php';
              if (!is_array($config)) throw new RuntimeException('Invalid config');
              $valid = true;
              foreach (['VK_COMMUNITY_ID','VK_CALLBACK_CONFIRMATION','VK_CALLBACK_SECRET'] as $name) {
                  $value = $config[$name] ?? null;
                  $present = is_string($value) && $value !== '' && !str_contains($value, "\0");
                  echo $name.'='.($present ? 'present' : 'missing')."\n";
                  $valid = $valid && $present;
              }
              $dir = $config['VK_SAPI_EVENTS_DIR'] ?? null;
              echo 'VK_SAPI_EVENTS_DIR='.(is_string($dir) && $dir !== '' ? 'present' : 'missing')."\n";
              if (($config['VK_COMMUNITY_ID'] ?? null) !== '220996873') {
                  echo "callback_community_binding=invalid\n";
                  $valid = false;
              }
              if (!$valid) exit(1);
          } catch (Throwable) {
              echo "callback_config=unavailable\n";
              exit(1);
          }
          PHP
          (cd artifact && sha256sum -c SHA256SUMS)
          stage2=$(ssh "$target" 'umask 077; mktemp -d /tmp/vk-to-gpt-callback.XXXXXXXX')
          [[ $stage2 =~ ^/tmp/vk-to-gpt-callback\.[a-zA-Z0-9]{8}$ ]]
          callback_applied=false
          mcp_applied=false
          bridge_prepared=false
          cleanup() {
            status=$?
            rollback_failed=false
            if (( status )); then
              if [[ $callback_applied == true ]]; then
                ssh "$target" bash "$stage2/update-webroot-file.sh" rollback "$webroot" "$stage2" "$GITHUB_SHA" callback.php || rollback_failed=true
              fi
              if [[ $mcp_applied == true ]]; then
                ssh "$target" bash "$stage2/update-webroot-file.sh" rollback "$webroot" "$stage2" "$GITHUB_SHA" mcp.php || rollback_failed=true
              fi
              if [[ $bridge_prepared == true ]]; then
                ssh "$target" /opt/php/8.4/bin/php "$stage2/callback-bridge.php" rollback "$stage2" "$webroot" || rollback_failed=true
              fi
            fi
            if [[ $rollback_failed == true ]]; then
              echo "Callback bridge rollback incomplete. Staging backup retained." >&2
            else
              ssh "$target" rm -rf -- "$stage2" || true
            fi
            return "$status"
          }
          trap cleanup EXIT
          scp -q artifact/diagnostics.tgz "$target:$stage2/"
          ssh "$target" tar -xzf "$stage2/diagnostics.tgz" -C "$stage2"
          ssh "$target" /opt/php/8.4/bin/php -l "$stage2/callback.php"
          if [[ "${{ inputs.publish_callback_bridge }}" == "true" ]]; then
            # No production changes until the existing MCP wrapper matches the allowed legacy variant.
            ssh "$target" /opt/php/8.4/bin/php -l "$stage2/mcp.php"
            ssh "$target" /opt/php/8.4/bin/php -l "$stage2/callback-bridge.php"
            ssh "$target" /opt/php/8.4/bin/php "$stage2/callback-bridge.php" verify-wrapper "$stage2" "$webroot"
            python3 -B deploy/verify.py --baseline "$RUNNER_TEMP/home.sha256"
            ssh "$target" /opt/php/8.4/bin/php "$stage2/callback-bridge.php" prepare "$stage2" "$webroot"
            bridge_prepared=true
            ssh "$target" bash "$stage2/update-webroot-file.sh" apply "$webroot" "$stage2" "$GITHUB_SHA" mcp.php
            mcp_applied=true
          fi
          ssh "$target" bash "$stage2/update-webroot-file.sh" apply "$webroot" "$stage2" "$GITHUB_SHA" callback.php
          callback_applied=true
          code=$(curl -s -o /dev/null -w '%{http_code}' https://vk.tattoomystery.ru/callback.php)
          [[ $code == 400 ]]
          # Check live VK handshake against private config without printing its value.
          ssh "$target" /opt/php/8.4/bin/php <<'PHP'
          <?php
          ini_set('display_errors', '0');
          try {
              $config = require '/var/www/u3641285/data/vk-to-gpt/shared/config.php';
              $expected = $config['VK_CALLBACK_CONFIRMATION'] ?? null;
              if (!is_string($expected) || $expected === '') exit(1);
              $handle = curl_init('https://vk.tattoomystery.ru/callback.php');
              if ($handle === false) exit(1);
              curl_setopt_array($handle, [
                  CURLOPT_POST => true,
                  CURLOPT_POSTFIELDS => json_encode(['type' => 'confirmation', 'group_id' => 220996873], JSON_THROW_ON_ERROR),
                  CURLOPT_HTTPHEADER => ['Content-Type: application/json'],
                  CURLOPT_RETURNTRANSFER => true,
                  CURLOPT_FOLLOWLOCATION => false,
                  CURLOPT_TIMEOUT => 15,
              ]);
              $body = curl_exec($handle);
              $status = curl_getinfo($handle, CURLINFO_RESPONSE_CODE);
              if ($status !== 200 || !is_string($body) || !hash_equals($expected, $body)) {
                  fwrite(STDERR, "Callback confirmation check failed\n");
                  exit(1);
              }
              echo "callback_confirmation=verified\n";
          } catch (Throwable) {
              fwrite(STDERR, "Callback confirmation check failed\n");
              exit(1);
          }
          PHP
          if [[ "${{ inputs.publish_callback_bridge }}" == "true" ]]; then
            ssh "$target" /opt/php/8.4/bin/php "$stage2/callback-bridge.php" check "$stage2" "$webroot"
            ssh "$target" /opt/php/8.4/bin/php <<'PHP'
          <?php
          ini_set('display_errors', '0');
          try {
              // In CLI, DOCUMENT_ROOT is blank and realpath('') points to cwd.
              // Set the actual webroot to check the same boundary as web PHP.
              $_SERVER['DOCUMENT_ROOT'] = '/var/www/u3641285/data/www/vk.tattoomystery.ru';
              require '/var/www/u3641285/data/vk-to-gpt/app/php/SapiEventReader.php';
              $config = require '/var/www/u3641285/data/vk-to-gpt/shared/config.php';
              $result = \VkToGpt\SapiEventReader::read($config['VK_SAPI_EVENTS_DIR'] ?? null,
                  ['group_id' => 220996873, 'limit' => 1, 'since' => 0]);
              $status = $result['status'] ?? null;
              if ($status !== 'AVAILABLE') {
                  fwrite(STDERR, "callback_reader_status=".(
                      in_array($status, ['NOT_CONFIGURED','UNAVAILABLE'], true) ? $status : 'unknown'
                  )."\n");
                  exit(1);
              }
              echo "callback_reader=available\n";
          } catch (Throwable) {
              fwrite(STDERR, "callback_reader=unavailable\n");
              exit(1);
          }
          PHP
            ssh "$target" /opt/php/8.4/bin/php <<'PHP' | python3 -B deploy/verify.py "$RUNNER_TEMP/home.sha256"
          <?php
          $config = require '/var/www/u3641285/data/vk-to-gpt/shared/config.php';
          echo $config['MCP_BEARER_TOKEN'];
          PHP
            echo "callback_bridge=verified" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "callback_endpoint=http_${code}" >> "$GITHUB_STEP_SUMMARY"
          echo "callback_confirmation=verified" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary SSH files
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"

  inspect-runtime:
    if: (inputs.inspect_runtime || inputs.read_probe) && github.actor == 'alena-lenom' && github.ref == 'refs/heads/feat/php-mcp-http'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: production
    env:
      PROD_HOST: ${{ secrets.PROD_HOST }}
      PROD_USER: ${{ secrets.PROD_USER }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure trusted SSH
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          set -eu
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf '%s\n' 'Host *' '  BatchMode yes' '  IdentitiesOnly yes' '  StrictHostKeyChecking yes' '  ConnectTimeout 15' > "$HOME/.ssh/config"
          ssh-keygen -F "$PROD_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null
      - name: Report configured credential names only
        if: inputs.inspect_runtime
        run: |
          ssh "$PROD_USER@$PROD_HOST" /opt/php/8.4/bin/php <<'PHP'
          <?php
          $config = require '/var/www/u3641285/data/vk-to-gpt/shared/config.php';
          foreach (['VK_USER_TOKEN', 'VK_SERVICE_KEY', 'VK_COMMUNITY_TOKEN'] as $name) {
              $configured = is_array($config) && isset($config[$name]) && is_string($config[$name]) && $config[$name] !== '';
              echo $name.'='.($configured ? 'present' : 'missing')."\n";
          }
          PHP
      - name: Probe deployed MCP read-only wall collection
        if: inputs.read_probe
        run: |
          set -euo pipefail
          ssh "$PROD_USER@$PROD_HOST" /opt/php/8.4/bin/php < deploy/probe-wall.php
      - name: Remove temporary SSH files
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"

  diagnose-callback:
    if: github.actor == 'alena-lenom' && github.ref == 'refs/heads/feat/callback-api-receiver' && inputs.diagnose_callback
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: production
    env:
      PROD_HOST: ${{ secrets.PROD_HOST }}
      PROD_USER: ${{ secrets.PROD_USER }}
    steps:
      - name: Configure trusted SSH
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          set -eu
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf '%s\n' 'Host *' '  BatchMode yes' '  IdentitiesOnly yes' '  StrictHostKeyChecking yes' '  ConnectTimeout 15' > "$HOME/.ssh/config"
          ssh-keygen -F "$PROD_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null
      - name: Inspect protected config and installed reader without secret values
        run: |
          ssh "$PROD_USER@$PROD_HOST" /opt/php/8.4/bin/php <<'PHP'
          <?php
          ini_set('display_errors', '0');
          try {
              $base = '/var/www/u3641285/data/vk-to-gpt';
              $webroot = '/var/www/u3641285/data/www/vk.tattoomystery.ru';
              $config = require $base.'/shared/config.php';
              if (!is_array($config)) throw new RuntimeException('Invalid config');
              // Inspect candidate field names and strictly numeric public app IDs only.
              $inspect = static function (array $values, string $parent = '', int $depth = 0) use (&$inspect): void {
                  foreach ($values as $key => $value) {
                      if (!is_string($key)) continue;
                      $path = $parent === '' ? $key : $parent.'.'.$key;
                      if (preg_match('/(?:app|client|application)/i', $key) === 1) {
                          $safePath = preg_replace('/[^A-Za-z0-9_.-]/', '_', substr($path, 0, 140));
                          echo 'vk_app_candidate_field='.$safePath.PHP_EOL;
                          if (is_int($value) || is_string($value)) {
                              $number = (string)$value;
                              if (preg_match('/^[1-9][0-9]{4,11}$/D', $number)
                                  && preg_match('/(?:app|application|client)/i', $path)) {
                                  echo 'vk_app_numeric_candidate='.$number.PHP_EOL;
                              }
                          }
                      }
                      if ($depth < 2 && is_array($value)) $inspect($value, $path, $depth + 1);
                  }
              };
              $inspect($config);
              $dir = $config['VK_SAPI_EVENTS_DIR'] ?? null;
              $bound = ($config['VK_COMMUNITY_ID'] ?? null) === '220996873';
              $absolute = is_string($dir) && str_starts_with($dir, '/');
              $root = $absolute ? realpath($dir) : false;
              $isDirectory = $root !== false && is_dir($root);
              $underWebroot = $root !== false
                  && ($root === $webroot || str_starts_with($root.'/', $webroot.'/'));
              $private = $isDirectory && !$underWebroot && !is_link($dir);
              $ready = $private;
              $files = [
                  'mcp_wrapper_event_binding' => [$webroot.'/mcp.php', 'VK_SAPI_EVENTS_DIR'],
                  'mcp_server_event_reader' => [$base.'/app/php/server.php', 'VK_SAPI_EVENTS_DIR'],
                  'mcp_reader_installed' => [$base.'/app/php/SapiEventReader.php', 'NOT_CONFIGURED'],
              ];
              echo 'community_bound='.($bound ? 'yes' : 'no')."\n";
              echo 'event_directory_configured='.(is_string($dir) && $dir !== '' ? 'yes' : 'no')."\n";
              echo 'event_path_absolute='.($absolute ? 'yes' : 'no')."\n";
              echo 'event_path_resolves='.($root !== false ? 'yes' : 'no')."\n";
              echo 'event_path_directory='.($isDirectory ? 'yes' : 'no')."\n";
              echo 'event_path_symlink='.(is_string($dir) && is_link($dir) ? 'yes' : 'no')."\n";
              echo 'event_path_under_webroot='.($underWebroot ? 'yes' : 'no')."\n";
              echo 'event_path_under_vk_project='.($absolute && str_starts_with($dir, $base.'/') ? 'yes' : 'no')."\n";
              echo 'event_path_parent_exists='.($absolute && is_dir(dirname($dir)) ? 'yes' : 'no')."\n";
              echo 'event_directory_exists='.($ready ? 'yes' : 'no')."\n";
              echo 'event_directory_readable='.($ready && is_readable($root) ? 'yes' : 'no')."\n";
              echo 'event_directory_writable='.($ready && is_writable($root) ? 'yes' : 'no')."\n";
              echo 'mcp_wrapper_exists='.(is_file($webroot.'/mcp.php') ? 'yes' : 'no')."\n";
              echo 'mcp_wrapper_readable='.(is_readable($webroot.'/mcp.php') ? 'yes' : 'no')."\n";
              foreach ($files as $label => [$path, $needle]) {
                  $source = is_file($path) && is_readable($path) ? file_get_contents($path) : false;
                  echo $label.'='.(is_string($source) && str_contains($source, $needle) ? 'yes' : 'no')."\n";
              }
          } catch (Throwable) {
              echo "callback_diagnostic=unavailable\n";
              exit(1);
          }
          PHP
      - name: Read VK Callback server status without exposing its secrets
        run: |
          set -euo pipefail
          ssh "$PROD_USER@$PROD_HOST" /opt/php/8.4/bin/php <<'PHP'
          <?php
          ini_set('display_errors', '0');
          $config = require '/var/www/u3641285/data/vk-to-gpt/shared/config.php';
          $token = is_array($config) ? ($config['VK_COMMUNITY_TOKEN'] ?? null) : null;
          if (!is_string($token) || $token === '') {
              echo "vk_callback_api=community_token_unavailable\n";
              exit;
          }
          $request = static function (string $method, array $params) use ($token): ?array {
              $handle = curl_init('https://api.vk.ru/method/'.$method);
              if ($handle === false) return null;
              curl_setopt_array($handle, [
                  CURLOPT_POST => true,
                  CURLOPT_POSTFIELDS => http_build_query($params + ['access_token' => $token, 'v' => '5.199']),
                  CURLOPT_HTTPHEADER => ['Content-Type: application/x-www-form-urlencoded'],
                  CURLOPT_RETURNTRANSFER => true,
                  CURLOPT_TIMEOUT => 15,
                  CURLOPT_FOLLOWLOCATION => false,
              ]);
              $response = curl_exec($handle);
              $status = curl_getinfo($handle, CURLINFO_RESPONSE_CODE);
              if ($status !== 200 || !is_string($response)) return null;
              $decoded = json_decode($response, true);
              return is_array($decoded) ? $decoded : null;
          };
          $servers = $request('groups.getCallbackServers', ['group_id' => 220996873]);
          if ($servers === null) {
              echo "vk_callback_api=transport_unavailable\n";
              exit;
          }
          if (isset($servers['error'])) {
              $code = $servers['error']['error_code'] ?? null;
              echo 'vk_callback_api_error_code='.(is_int($code) ? $code : 'unknown')."\n";
              exit;
          }
          $items = $servers['response']['items'] ?? null;
          if (!is_array($items)) {
              echo "vk_callback_api=unexpected_response\n";
              exit;
          }
          $matches = array_values(array_filter($items, static fn($item): bool =>
              is_array($item) && ($item['url'] ?? null) === 'https://vk.tattoomystery.ru/callback.php'));
          echo 'vk_matching_callback_servers='.count($matches)."\n";
          if (count($matches) !== 1) exit;
          $server = $matches[0];
          $status = $server['status'] ?? null;
          echo 'vk_callback_server_status='.(in_array($status, ['ok', 'wait', 'failed', 'unconfigured'], true) ? $status : 'unknown')."\n";
          $serverId = $server['id'] ?? null;
          if (!is_int($serverId) || $serverId <= 0) exit;
          $settings = $request('groups.getCallbackSettings', ['group_id' => 220996873, 'server_id' => $serverId]);
          if ($settings === null) {
              echo "vk_callback_events=transport_unavailable\n";
          } elseif (isset($settings['error'])) {
              $code = $settings['error']['error_code'] ?? null;
              echo 'vk_callback_settings_error_code='.(is_int($code) ? $code : 'unknown')."\n";
          } else {
              $events = $settings['response']['events'] ?? null;
              $enabled = is_array($events) ? ($events['wall_reply_new'] ?? null) : null;
              echo 'vk_wall_reply_new_enabled='.($enabled === 1 || $enabled === true ? 'yes' : ($enabled === 0 || $enabled === false ? 'no' : 'unknown'))."\n";
          }
          PHP
      - name: Remove temporary SSH files
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"

  activate-callback:
    if: github.actor == 'alena-lenom' && github.ref == 'refs/heads/feat/callback-api-receiver' && inputs.publish_callback && inputs.publish_callback_bridge && inputs.enable_wall_reply_new
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment: production
    env:
      PROD_HOST: ${{ secrets.PROD_HOST }}
      PROD_USER: ${{ secrets.PROD_USER }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure trusted SSH
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          set -eu
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf '%s\n' 'Host *' '  BatchMode yes' '  IdentitiesOnly yes' '  StrictHostKeyChecking yes' '  ConnectTimeout 15' > "$HOME/.ssh/config"
          ssh-keygen -F "$PROD_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null
      - name: Enable only wall_reply_new on the confirmed VK server
        run: |
          set -euo pipefail
          ssh "$PROD_USER@$PROD_HOST" /opt/php/8.4/bin/php < deploy/enable-wall-reply-callback.php
          echo "vk_wall_reply_new=verified" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary SSH files
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"
