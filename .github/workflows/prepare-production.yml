name: REG.RU PHP deploy

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Exact candidate commit SHA to check
        type: string
        required: true
      publish:
        description: Publish the guarded read-only post-counter summary after tests
        type: boolean
        default: false
      publish_callback:
        description: Publish the guarded Callback API receiver to the webroot
        type: boolean
        default: false
      inspect_runtime:
        description: Report credential variable presence from private configuration
        type: boolean
        default: false
      read_probe:
        description: Invoke read-only MCP wall collector from server without disclosing credentials
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vk-to-gpt-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_REVISION: ${{ inputs.expected_revision }}
    steps:
      - name: Check the approved revision
        run: test "$EXPECTED_REVISION" = "$GITHUB_SHA"
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          extensions: curl, fileinfo, json, openssl, mbstring, pdo_sqlite, sqlite3
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test candidate
        run: |
          set -eu
          composer validate --no-check-publish
          composer install --no-dev --no-interaction --prefer-dist --no-scripts
          composer check-platform-reqs --no-dev
          composer audit --locked --no-interaction
          composer test
          node test/php/contract.mjs
          node --test test/read-only.test.js
          python3 -B test/php/smoke_http.py
          bash test/php/update_read_diagnostics.sh
          php -l deploy/probe-wall.php
          php -l public/callback.php
          python3 -B test/php/callback_confirmation.py
          bash -n deploy/update-webroot-file.sh
      - name: Package the bounded publish set
        run: |
          set -eu
          mkdir -p stage/php artifact
          cp php/WallCollector.php stage/php/
          cp deploy/update-read-diagnostics.sh stage/
          cp public/callback.php stage/
          cp deploy/update-webroot-file.sh stage/
          printf '%s\n' "$GITHUB_SHA" > stage/REVISION
          tar -C stage -czf artifact/diagnostics.tgz php/WallCollector.php REVISION update-read-diagnostics.sh callback.php update-webroot-file.sh
          (cd artifact && sha256sum diagnostics.tgz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: vk-to-gpt-php-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 7

  deploy:
    # Analytics deploys stay on the MCP branch; callback deploys may run from either release branch.
    if: github.actor == 'alena-lenom' && ((github.ref == 'refs/heads/feat/php-mcp-http' && (inputs.publish || inputs.publish_callback)) || (github.ref == 'refs/heads/feat/callback-api-receiver' && inputs.publish_callback))
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      PROD_HOST: ${{ secrets.PROD_HOST }}
      PROD_USER: ${{ secrets.PROD_USER }}
      PROD_PATH: ${{ vars.PROD_PATH }}
      BASELINE: 66726f80564dafe24adab25dd01bd113477231b5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vk-to-gpt-php-${{ github.sha }}
          path: artifact
      - name: Configure trusted SSH
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          set -eu
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf '%s\n' 'Host *' '  BatchMode yes' '  IdentitiesOnly yes' '  StrictHostKeyChecking yes' '  ConnectTimeout 15' > "$HOME/.ssh/config"
          ssh-keygen -F "$PROD_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null
      - name: Update code and verify HTTPS and MCP
        if: inputs.publish && github.ref == 'refs/heads/feat/php-mcp-http'
        run: |
          set -euo pipefail
          target="$PROD_USER@$PROD_HOST"
          app=/var/www/u3641285/data/vk-to-gpt/app
          python3 -B deploy/verify.py --baseline "$RUNNER_TEMP/home.sha256"
          (cd artifact && sha256sum -c SHA256SUMS)
          stage=$(ssh "$target" 'umask 077; mktemp -d /tmp/vk-to-gpt-diagnostics.XXXXXXXX')
          [[ $stage =~ ^/tmp/vk-to-gpt-diagnostics\.[a-zA-Z0-9]{8}$ ]]
          applied=false
          applying=false
          cleanup() {
            status=$?
            if (( status )) && [[ $applied == true ]]; then
              if ! ssh "$target" bash "$stage/update-read-diagnostics.sh" rollback "$app" "$stage" "$BASELINE" "$GITHUB_SHA"; then
                echo "Rollback failed. Retained backup at $stage/backup" >&2
                return "$status"
              fi
            elif (( status )) && [[ $applying == true ]]; then
              echo "Update failed. Inspect any backup at $stage/backup" >&2
              return "$status"
            fi
            ssh "$target" rm -rf -- "$stage"
            return "$status"
          }
          trap cleanup EXIT
          scp -q artifact/diagnostics.tgz "$target:$stage/"
          ssh "$target" tar -xzf "$stage/diagnostics.tgz" -C "$stage"
          for file in WallCollector.php; do
            ssh "$target" /opt/php/8.4/bin/php -l "$stage/php/$file"
          done
          applying=true
          ssh "$target" bash "$stage/update-read-diagnostics.sh" apply "$app" "$stage" "$BASELINE" "$GITHUB_SHA"
          applied=true
          [[ $(ssh "$target" cat "$app/REVISION") == "$GITHUB_SHA" ]]
          ssh "$target" /opt/php/8.4/bin/php <<'PHP' | python3 -B deploy/verify.py "$RUNNER_TEMP/home.sha256"
          <?php
          $config = require '/var/www/u3641285/data/vk-to-gpt/shared/config.php';
          echo $config['MCP_BEARER_TOKEN'];
          PHP
          ssh "$target" VK_PROBE_METRICS=1 /opt/php/8.4/bin/php < deploy/probe-wall.php
          printf '%s\n' 'Guarded post metrics update published. Exact revision, HTTPS, MCP, OAuth and live post_metric_summary verified.' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish guarded callback endpoint
        if: inputs.publish_callback
        run: |
          set -euo pipefail
          target="$PROD_USER@$PROD_HOST"
          webroot=${PROD_PATH:?PROD_PATH variable is required}
          [[ $webroot =~ ^/var/www/u[0-9]+/data/www/vk[.]tattoomystery[.]ru$ ]]
          # Validate the existing private config before touching the public endpoint.
          ssh "$target" /opt/php/8.4/bin/php <<'PHP'
          <?php
          ini_set('display_errors', '0');
          try {
              $config = require '/var/www/u3641285/data/vk-to-gpt/shared/config.php';
              if (!is_array($config)) throw new RuntimeException('Invalid config');
              $valid = true;
              foreach (['VK_COMMUNITY_ID','VK_CALLBACK_CONFIRMATION','VK_CALLBACK_SECRET'] as $name) {
                  $value = $config[$name] ?? null;
                  $present = is_string($value) && $value !== '' && !str_contains($value, "\0");
                  echo $name.'='.($present ? 'present' : 'missing')."\n";
                  $valid = $valid && $present;
              }
              $dir = $config['VK_SAPI_EVENTS_DIR'] ?? null;
              echo 'VK_SAPI_EVENTS_DIR='.(is_string($dir) && $dir !== '' ? 'present' : 'missing')."\n";
              if (($config['VK_COMMUNITY_ID'] ?? null) !== '220996873') {
                  echo "callback_community_binding=invalid\n";
                  $valid = false;
              }
              if (!$valid) exit(1);
          } catch (Throwable) {
              echo "callback_config=unavailable\n";
              exit(1);
          }
          PHP
          (cd artifact && sha256sum -c SHA256SUMS)
          stage2=$(ssh "$target" 'umask 077; mktemp -d /tmp/vk-to-gpt-callback.XXXXXXXX')
          [[ $stage2 =~ ^/tmp/vk-to-gpt-callback\.[a-zA-Z0-9]{8}$ ]]
          applied=false
          cleanup() {
            status=$?
            if (( status )) && [[ $applied == true ]]; then
              if ! ssh "$target" bash "$stage2/update-webroot-file.sh" rollback "$webroot" "$stage2" "$GITHUB_SHA" callback.php; then
                echo "Callback rollback failed. Retained backup at $stage2/backup" >&2
                return "$status"
              fi
            fi
            ssh "$target" rm -rf -- "$stage2"
            return "$status"
          }
          trap cleanup EXIT
          scp -q artifact/diagnostics.tgz "$target:$stage2/"
          ssh "$target" tar -xzf "$stage2/diagnostics.tgz" -C "$stage2"
          ssh "$target" /opt/php/8.4/bin/php -l "$stage2/callback.php"
          ssh "$target" bash "$stage2/update-webroot-file.sh" apply "$webroot" "$stage2" "$GITHUB_SHA" callback.php
          applied=true
          code=$(curl -s -o /dev/null -w '%{http_code}' https://vk.tattoomystery.ru/callback.php)
          [[ $code == 400 ]]
          # Check live VK handshake against private config without printing its value.
          ssh "$target" /opt/php/8.4/bin/php <<'PHP'
          <?php
          ini_set('display_errors', '0');
          try {
              $config = require '/var/www/u3641285/data/vk-to-gpt/shared/config.php';
              $expected = $config['VK_CALLBACK_CONFIRMATION'] ?? null;
              if (!is_string($expected) || $expected === '') exit(1);
              $handle = curl_init('https://vk.tattoomystery.ru/callback.php');
              if ($handle === false) exit(1);
              curl_setopt_array($handle, [
                  CURLOPT_POST => true,
                  CURLOPT_POSTFIELDS => json_encode(['type' => 'confirmation', 'group_id' => 220996873], JSON_THROW_ON_ERROR),
                  CURLOPT_HTTPHEADER => ['Content-Type: application/json'],
                  CURLOPT_RETURNTRANSFER => true,
                  CURLOPT_FOLLOWLOCATION => false,
                  CURLOPT_TIMEOUT => 15,
              ]);
              $body = curl_exec($handle);
              $status = curl_getinfo($handle, CURLINFO_RESPONSE_CODE);
              if ($status !== 200 || !is_string($body) || !hash_equals($expected, $body)) {
                  fwrite(STDERR, "Callback confirmation check failed\n");
                  exit(1);
              }
              echo "callback_confirmation=verified\n";
          } catch (Throwable) {
              fwrite(STDERR, "Callback confirmation check failed\n");
              exit(1);
          }
          PHP
          echo "callback_endpoint=http_${code}" >> "$GITHUB_STEP_SUMMARY"
          echo "callback_confirmation=verified" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary SSH files
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"

  inspect-runtime:
    if: (inputs.inspect_runtime || inputs.read_probe) && github.actor == 'alena-lenom' && (github.ref == 'refs/heads/feat/php-mcp-http' || (github.ref == 'refs/heads/feat/callback-api-receiver' && inputs.inspect_runtime && !inputs.read_probe))
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: production
    env:
      PROD_HOST: ${{ secrets.PROD_HOST }}
      PROD_USER: ${{ secrets.PROD_USER }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure trusted SSH
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          set -eu
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf '%s\n' 'Host *' '  BatchMode yes' '  IdentitiesOnly yes' '  StrictHostKeyChecking yes' '  ConnectTimeout 15' > "$HOME/.ssh/config"
          ssh-keygen -F "$PROD_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null
      - name: Inspect callback event bridge without revealing private values
        if: inputs.inspect_runtime && github.ref == 'refs/heads/feat/callback-api-receiver'
        run: |
          set -euo pipefail
          ssh "$PROD_USER@$PROD_HOST" /opt/php/8.4/bin/php <<'PHP'
          <?php
          ini_set('display_errors', '0');
          try {
              $base = '/var/www/u3641285/data/vk-to-gpt';
              $web = '/var/www/u3641285/data/www/vk.tattoomystery.ru';
              $config = require $base.'/shared/config.php';
              if (!is_array($config)) throw new RuntimeException('invalid config');
              $configured = $config['VK_SAPI_EVENTS_DIR'] ?? null;
              $present = is_string($configured) && $configured !== '';
              $directory = $present ? realpath($configured) : false;
              $webDirectory = realpath($web);
              $valid = $directory !== false && is_dir($directory) && !is_link($configured)
                  && ($webDirectory === false || !str_starts_with($directory.'/', $webDirectory.'/'));
              $bootstrap = $web.'/mcp.php';
              $bootstrapSource = is_file($bootstrap) && is_readable($bootstrap)
                  ? file_get_contents($bootstrap) : false;
              $forwarded = is_string($bootstrapSource)
                  && str_contains($bootstrapSource, "'VK_SAPI_EVENTS_DIR'");
              foreach ([
                  'callback_events_path_configured' => $present,
                  'callback_events_directory_valid' => $valid,
                  'callback_events_cli_readable' => $valid && is_readable($directory),
                  'callback_events_cli_writable' => $valid && is_writable($directory),
                  'deployed_mcp_wrapper_present' => is_string($bootstrapSource),
                  'deployed_mcp_wrapper_forwards_events_dir' => $forwarded,
                  'deployed_sapi_reader_present' => is_file($base.'/app/php/SapiEventReader.php'),
              ] as $key => $value) {
                  echo $key.'='.($value ? 'yes' : 'no')."\n";
              }
          } catch (Throwable) {
              echo "callback_bridge_diagnostic=unavailable\n";
              exit(1);
          }
          PHP
      - name: Report configured credential names only
        if: inputs.inspect_runtime && github.ref == 'refs/heads/feat/php-mcp-http'
        run: |
          ssh "$PROD_USER@$PROD_HOST" /opt/php/8.4/bin/php <<'PHP'
          <?php
          $config = require '/var/www/u3641285/data/vk-to-gpt/shared/config.php';
          foreach (['VK_USER_TOKEN', 'VK_SERVICE_KEY', 'VK_COMMUNITY_TOKEN'] as $name) {
              $configured = is_array($config) && isset($config[$name]) && is_string($config[$name]) && $config[$name] !== '';
              echo $name.'='.($configured ? 'present' : 'missing')."\n";
          }
          PHP
      - name: Probe deployed MCP read-only wall collection
        if: inputs.read_probe
        run: |
          set -euo pipefail
          ssh "$PROD_USER@$PROD_HOST" /opt/php/8.4/bin/php < deploy/probe-wall.php
      - name: Remove temporary SSH files
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"
